<script>
// Erea Help Desk, full screen. Link: help.html  (staff: help.html?b=<studio booking id>)

var f = document.createElement('iframe');
f.src = HELP + (/^[a-f0-9]{8,32}$/.test(b) ? '&b=' + b : '');
f.title = 'Erea Help Desk';
document.body.appendChild(f);
</script>
