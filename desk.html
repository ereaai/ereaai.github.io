<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erea Front Desk</title>
<link rel="manifest" href="desk.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Front Desk">
<style>
html,body{margin:0;height:100%;background:#f7f8fc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
iframe{position:fixed;left:0;right:0;top:0;bottom:26px;width:100%;height:calc(100% - 26px);border:0;background:#f7f8fc}
.bar{position:fixed;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#5b5f7a;background:#eef0ff;border-top:1px solid #e3e5f0}
.bar a{color:#4f46e5;font-weight:700}
.msg{max-width:380px;margin:80px auto;padding:28px;background:#fff;border-radius:20px;text-align:center;color:#22263B}
</style>
</head>
<body>
<script>
// Staff Front Desk, shown inside Erea's page (no Google banner). Link: desk?s=<studio key>
var DESK = 'https://script.google.com/macros/s/AKfycbyFGh5QoxaRvqYYXL7rLemDDrKmyCLZPcnrG-oaj0ABk9lgoZTV34Gax3e44QkbXEAa/exec';
var s = new URLSearchParams(location.search).get('s') || '';
try { if (s) localStorage.setItem('erea_s', s); else s = localStorage.getItem('erea_s') || ''; } catch (e) {}
if (!/^[A-Za-z0-9]{3,40}$/.test(s)) {
  document.body.innerHTML = '<div class="msg"><b>This link is missing your studio.</b><br>Ask Erea for your Front Desk link.</div>';
} else {
  var url = DESK + '?s=' + s;
  var f = document.createElement('iframe');
  f.src = url; f.title = 'Erea Front Desk';
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
  var bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = 'Erea Front Desk · Not loading? <a href="' + url + '" target="_top">Open it here</a>';
  document.body.appendChild(bar);
}
</script>
</body>
</html>
