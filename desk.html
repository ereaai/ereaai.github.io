<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erea Front Desk</title>
<link rel="manifest" href="desk.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Front Desk">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF8EF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#22263B}
.card{max-width:380px;margin:24px;padding:28px;background:#fff;border-radius:20px;border:1px solid #F1E2CC;text-align:center}
.card img{width:72px;height:72px;border-radius:18px}
h1{margin:14px 0 6px;font-size:24px}
p{margin:0 0 18px;color:#4A4458;line-height:1.5}
a.go{display:block;padding:14px;border-radius:999px;background:#C8402A;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <img src="icon-192.png" alt="">
  <h1>Erea Front Desk</h1>
  <p id="t">Opening your Front Desk…</p>
  <a class="go" id="go" href="#" hidden>Open Front Desk</a>
</div>
<script>
// Staff launcher. Link: desk.html?s=<studio key>. Opens the Front Desk directly so staff stay signed in to Google.
var DESK = 'https://script.google.com/macros/s/AKfycbyFGh5QoxaRvqYYXL7rLemDDrKmyCLZPcnrG-oaj0ABk9lgoZTV34Gax3e44QkbXEAa/exec';
var s = new URLSearchParams(location.search).get('s') || '';
try { if (s) localStorage.setItem('erea_s', s); else s = localStorage.getItem('erea_s') || ''; } catch (e) {}
if (!/^[A-Za-z0-9]{3,40}$/.test(s)) {
  document.getElementById('t').textContent = 'This link is missing your studio. Ask Erea for your Front Desk link.';
} else {
  var url = DESK + '?s=' + s, go = document.getElementById('go');
  go.href = url; go.hidden = false;
  setTimeout(function () { location.href = url; }, 600);
}
</script>
</body>
</html>
