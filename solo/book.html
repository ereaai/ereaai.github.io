<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a session</title>
<link rel="manifest" href="/solo/book.webmanifest">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#137A6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Book">
<style>
html,body{margin:0;height:100%;background:#137A6F}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFF8EF}
.msg{max-width:420px;margin:80px auto;padding:24px;background:#fff;border-radius:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#22263B;text-align:center}
</style>
</head>
<body>
<script>
// Erea Solo client booking page, shown full screen without Google's banner.
// Link: /solo/book?b=<instructor booking id>&n=<instructor name>
var BOOK = 'https://script.google.com/macros/s/AKfycbxmxU-cwk20Gqvpz6xf4aOnosJhZFhT0E4D1FH_JBpskJGDRDZgjOTXc-GZQtm5M_YaUA/exec';
var q = new URLSearchParams(location.search);
var b = q.get('b') || '', n = q.get('n') || '';
try {
  if (b) { localStorage.setItem('erea_solo_b', b); if (n) localStorage.setItem('erea_solo_n', n); }
  else { b = localStorage.getItem('erea_solo_b') || ''; n = n || localStorage.getItem('erea_solo_n') || ''; }
} catch (e) {}
if (!/^[a-f0-9]{8,32}$/.test(b)) {
  document.body.innerHTML = '<div class="msg"><b>This booking link is missing its instructor.</b><br>Please ask your instructor for their booking link.</div>';
} else {
  if (n) document.title = n;
  var f = document.createElement('iframe');
  f.src = BOOK + '?b=' + b + (q.get('checkin') ? '&checkin=1' : '');
  f.title = n || 'Book a session';
  document.body.appendChild(f);
}
</script>
</body>
</html>
